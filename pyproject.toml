[project]
name = "silpo-pack-agent"
version = "0.2.0"
description = "Агент паків «Сільпо» поверх офіційного MCP — хакатон AI Factory"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=2.0.0",
    "uvicorn>=0.30",
]

[project.scripts]
silpo-login = "silpo_agent_mcp.login:main"
silpo-agent-mcp = "silpo_agent_mcp.server:main"
silpo-probe = "silpo_agent_mcp.probe:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["silpo_agent_mcp", "profile_mcp"]
