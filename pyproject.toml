[project]
name = "silpo-mcp-mock"
version = "0.1.0"
description = "Мок MCP «Сільпо» для хакатону AI Factory — локальний імітатор із фейковими даними"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
]

[project.scripts]
silpo-mcp = "silpo_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["silpo_mcp"]
