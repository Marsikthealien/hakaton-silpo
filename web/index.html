<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сільпо Pack Agent</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="page"><div class="cols main">

  <!-- сценарії — поза «телефоном» -->
  <div class="col">
    <section class="card">
      <div class="head"><div class="t"><h2 style="margin:0">Сценарії</h2>
        <div class="soft">Та сама фраза, яку сказала б людина</div></div></div>
      <div class="viewswitch" style="margin-bottom:12px">
        <button data-mode="direct" aria-pressed="true" onclick="setMode('direct')">Напряму</button>
        <button data-mode="llm" aria-pressed="false" onclick="setMode('llm')">Через модель</button>
      </div>
      <p class="soft" id="mode-note" style="margin:0 0 12px"></p>
      <div id="scenarios"></div>
    </section>
  </div>

  <!-- застосунок: чат і кошик -->
  <div class="col">
    <div id="alerts"></div>
    <div class="appframe">
      <div class="appbar">
        <span class="mushroom"></span>
        <span class="ttl">Машрум Геннадійович</span>
        <button class="ico" title="Про асистента" onclick="about()">i</button>
      </div>
      <div class="apptabs">
        <button aria-selected="true" onclick="appTab('chat')">Чат</button>
        <button aria-selected="false" onclick="appTab('cart')">Кошик</button>
      </div>

      <div class="appbody" id="tab-chat">
        <div id="log"></div>
        <div class="quicks" id="quicks"></div>
      </div>

      <div class="appbody" id="tab-cart" hidden><div id="cart" class="muted">—</div></div>

      <div class="appfoot" id="foot-chat">
        <div class="sendbar">
          <input id="ask" placeholder="Ваше повідомлення"
                 onkeydown="if(event.key==='Enter')send()">
          <button class="send" onclick="send()" title="Надіслати">➤</button>
        </div>
        <p class="soft" id="chat-note" style="margin:7px 2px 0"></p>
      </div>
    </div>

    <section class="card" style="margin-top:16px"><div id="pack"></div></section>
  </div>

  <div class="col">
    <section class="card mobile-only" style="margin-bottom:16px">
      <h3>Сценарії</h3>
      <div id="scenarios-2"></div>
    </section>

    <section class="card desktop-only">
      <div class="head"><div class="t"><h2 style="margin:0">Кошик «Сільпо»</h2>
        <div class="soft">Справжній кошик акаунта</div></div>
        <button class="go ghost" onclick="renderCart($('#cart-side'))">Оновити</button></div>
      <div id="cart-side" class="muted">—</div>
    </section>
    <div id="payment" class="desktop-only"></div>
    <section class="card desktop-only">
      <h3>Згорають сьогодні</h3>
      <div id="expiring" class="muted">—</div>
    </section>
  </div>

</div></div>

<dialog id="picker"><div id="picker-body"></div></dialog>
<dialog id="quiz"><div id="quiz-body"></div></dialog>

<script src="/app.js"></script>
<script>
let CHAT = [];
const QUICKS = ['Повтори останній чек', 'Що в мене закінчилось',
                'Вечеря на 400 грн', 'Чи влізе кошик у доставку'];

function appTab(name){
  ['chat','cart'].forEach(n => $('#tab-'+n).hidden = n !== name);
  $('#foot-chat').hidden = name !== 'chat';
  document.querySelectorAll('.apptabs button').forEach((b,i) =>
    b.setAttribute('aria-selected', (i===0) === (name==='chat')));
  if(name === 'cart') renderCart($('#cart'));
}
function bubble(cls, text){
  const map = {me:'you', it:'bot', tools:'sys'};
  $('#log').insertAdjacentHTML('beforeend',
    `<div class="msg ${map[cls] || cls}">${text}</div>`);
  $('#tab-chat').scrollTop = 1e6;
}
function about(){
  $('#quiz-body').innerHTML = `
    <h2 style="margin:0 0 8px">Я — Машрум Геннадійович</h2>
    <p class="muted" style="margin:0 0 10px">У режимі цього розширення допомагаю так:</p>
    <ul style="margin:0;padding-left:18px;font-size:14px;line-height:1.6">
      <li>читаю твої чеки й рахую, що вже мало б закінчитись;</li>
      <li>збираю пак і кладу його у <b>справжній</b> кошик «Сільпо»;</li>
      <li>дивлюсь, які з твоїх купонів спрацюють саме тут;</li>
      <li>перевіряю, чи немає в наборі того, що тобі не можна;</li>
      <li>кажу, скільки бракує до Дольок і до дешевшої доставки.</li>
    </ul>
    <p class="soft" style="margin:12px 0 0">Оформлення замовлення завжди підтверджуєш ти.</p>
    <button class="go" style="width:100%;margin-top:12px" onclick="quiz.close()">Зрозуміло</button>`;
  quiz.showModal();
}
async function send(){
  const text = $('#ask').value.trim(); if(!text) return;
  $('#ask').value=''; bubble('me', text); CHAT.push({role:'user', content:text});
  bubble('it','…');
  const r = await api('/api/chat','POST',{messages:CHAT});
  $('#log').lastChild.remove();
  if(r.tools_used?.length) bubble('tools','→ '+r.tools_used.map(t=>t.name).join(' · '));
  bubble('it', r.reply || r.error || '—');
  if(r.reply) CHAT.push({role:'assistant', content:r.reply});
  if(r.result?.items) renderPack(r.result);
  else { const d = await api('/api/packs'); if(d.packs?.length) openPack(d.packs[0].id); }
}
function quick(text){ $('#ask').value = text; send(); }

async function loadExpiring(){
  const e = await api('/api/expiring?days=1');
  const all = [...(e.promos||[]), ...(e.coupons||[])];
  $('#expiring').innerHTML = all.length
    ? all.slice(0,6).map((x,i) => ticket({reward:x.reward, text:x.text}, i)).join('')
    : '<span class="muted">Нічого термінового. Персональні промо оновлюються щотижня.</span>';
}

mountTop('home');
(async () => {
  renderPack(null);
  renderScenarios($('#scenarios'), $('#scenarios-2'));
  $('#quicks').innerHTML = QUICKS.map(q =>
    `<button onclick="quick('${q}')">${q}</button>`).join('');
  bubble('it', 'Готовий. Питайте.');
  const s = await loadStatus();
  $('#mode-note').textContent = s.model_available
    ? `Модель ${s.model} на звʼязку — повний агентний цикл.`
    : 'Модель офлайн: вільний текст розбираю правилами й усе одно виконую сценарій.';
  $('#chat-note').textContent = s.model_available ? ''
    : 'Без моделі намір визначаю за ключовими словами.';
  await Promise.all([loadAllergies(), loadExpiring(), renderCart($('#cart-side'))]);
})();
</script>
</body>
</html>
