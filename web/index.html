<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Хакатон «Сільпо» · асистент</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>

<!-- Панелі — колонки сітки, а не накладки: коли вони закриті, робоча область
     займає всю ширину, коли відкриті — розсовують її. -->
<div class="shell" id="shell">

  <aside class="side l" id="side-left">
    <div class="dhead">
      <div class="t" style="flex:1;min-width:0"><h2>Сценарії</h2>
        <div class="soft">Та сама фраза, яку сказала б людина</div></div>
      <button class="iconbtn sm plain" onclick="closePanels()" title="Сховати"></button>
    </div>
    <div class="dbody">
      <div class="viewswitch" style="margin-bottom:12px">
        <button data-mode="direct" aria-pressed="true" onclick="setMode('direct')">Напряму</button>
        <button data-mode="llm" aria-pressed="false" onclick="setMode('llm')">Через модель</button>
      </div>
      <p class="soft" id="mode-note" style="margin:0 0 12px"></p>
      <div id="scenarios"></div>

      <h2 style="margin:22px 0 3px;font-size:16px">Гроші та звички</h2>
      <p class="soft" style="margin:0 0 12px">Відповідь — одне число з твоїх чеків.
        Нових tools не треба</p>
      <div id="insights"></div>
    </div>
  </aside>

  <main class="main">
    <div class="appwrap">
      <div class="appframe chat">
        <div class="appbar">
          <button class="iconbtn sm plain" id="btn-left" onclick="togglePanel('l')"
            title="Сценарії" aria-pressed="false"></button>
          <span class="mushroom"></span>
          <span class="ttl">Машрум Геннадійович</span>
          <a class="iconbtn sm plain" href="/game" title="Грибниця" id="ab-game"></a>
          <a class="iconbtn sm plain" href="/profile" title="Профіль" id="ab-user"></a>
          <button class="iconbtn sm plain" id="btn-tts" onclick="toggleTts()"
            title="Озвучувати відповіді" aria-pressed="false"></button>
          <button class="iconbtn sm plain" title="Про асистента" onclick="about()" id="ab-info">i</button>
          <button class="iconbtn sm plain" id="btn-right" onclick="togglePanel('r')"
            title="Кошик «Сільпо»" aria-pressed="false"></button>
        </div>

        <div class="appbody" id="tab-chat">
          <div id="log"></div>
          <div class="quicks" id="quicks"></div>
        </div>

        <div class="appbody" id="tab-cart" hidden><div id="cart" class="muted">—</div></div>

        <div class="appfoot" id="foot-chat">
          <div class="sendbar">
            <input id="ask" placeholder="Ваше повідомлення"
                   onkeydown="if(event.key==='Enter')send()">
            <button class="send" onclick="send()" title="Надіслати" id="sendbtn"></button>
          </div>
          <p class="soft" id="chat-note" style="margin:7px 2px 0"></p>
        </div>

        <div id="nav"></div>
      </div>
    </div>
  </main>

  <aside class="side r" id="side-right">
    <div class="dhead">
      <div class="t" style="flex:1;min-width:0"><h2>Кошик «Сільпо»</h2>
        <div class="soft">Справжній кошик акаунта</div></div>
      <button class="iconbtn sm plain" onclick="renderCart($('#cart-side'))"
        title="Оновити" id="cart-refresh"></button>
      <button class="iconbtn sm plain" onclick="closePanels()" title="Сховати"></button>
    </div>
    <div class="dbody">
      <div id="cart-side" class="muted">—</div>
      <div id="payment" style="margin-top:14px"></div>
      <section class="card" style="margin-top:14px">
        <h3>Згорають сьогодні</h3>
        <div id="expiring" class="muted">—</div>
      </section>
    </div>
  </aside>

</div>

<dialog id="picker"><div id="picker-body"></div></dialog>
<dialog id="quiz"><div id="quiz-body"></div></dialog>

<script src="/app.js"></script>
<script>
let CHAT = [];
const QUICKS = ['Повтори останній чек', 'Що в мене закінчилось',
                'Вечеря на 400 грн', 'Скільки я зекономив'];
// Підказки міняються, щойно з'явився пак: далі корисніше правити його словами.
var QUICKS_PACK = ['Прибери пакет', 'Додай молоко', 'Заміни чипси на дешевше',
                   'Поклади в кошик'];

function appTab(name){
  // Вкладок дві: розмова (в ній же паки) і справжній кошик «Сільпо».
  ['chat','cart'].forEach(t => {
    const body = $('#tab-' + t);
    if (body) body.hidden = t !== name;
  });
  $('#foot-chat').hidden = name !== 'chat';
  document.querySelectorAll('#nav .appnav button').forEach((b, i) =>
    b.setAttribute('aria-selected', ['chat','cart'][i] === name));
  if (name === 'cart') renderCart($('#cart'));
}

function bubble(who, text, opts){
  const cls = who === 'me' ? 'you' : who === 'tools' ? 'sys' : 'bot';
  $('#log').insertAdjacentHTML('beforeend', `<div class="msg ${cls}">${text}</div>`);
  $('#log').scrollTop = $('#log').scrollHeight;
  // Вголос ідуть лише відповіді агента: власні репліки гість щойно набрав,
  // а «→ pack_remove» слухати нема сенсу. `silent` — для індикатора роботи,
  // який ще не є відповіддю.
  if (who === 'it' && !(opts && opts.silent)) speak(text);
}

async function send(){
  const text = $('#ask').value.trim();
  if (!text) return;
  $('#ask').value = '';
  bubble('me', text);
  CHAT.push({role:'user', content:text});
  const t = thinking();
  const r = await api('/api/chat', 'POST', { messages: CHAT });
  if (r.error) { t.fail(r.error); return; }
  // Рядок про виклики tools ставимо ПЕРЕД індикатором, щоб він не перестрибував
  // через відповідь, коли та зʼявиться.
  if (r.tools_used?.length)
    t.el.insertAdjacentHTML('beforebegin',
      `<div class="msg sys">→ ${r.tools_used.map(x => x.name).join(' · ')}</div>`);
  const reply = r.reply || 'Готово.';
  await t.finish(reply);
  CHAT.push({role:'assistant', content:reply});
  // Пак додається в ту саму стрічку — під відповіддю агента.
  if (r.result?.items) renderPack(r.result);
}
function quick(q){ $('#ask').value = q; send(); }

async function about(){
  sheet('Машрум Геннадійович + Pack Agent',
    'Що саме додано до наявного асистента', `
    <p>Машрум радить. Ми даємо йому <b>памʼять</b> — портрет гостя з реальних чеків,
      <b>руки</b> — запис у справжній кошик, і <b>калькулятор</b> — купони, пороги
      доставки й Дольок.</p>
    <p class="soft">Усе працює на офіційному <span class="mono">mcp.silpo.ua</span>.
      Те, чого в MCP немає, позначено окремо — і в стрічці викликів, і в описі сценарію.</p>
    <div class="grid2" style="margin-top:12px">
      <a class="kpi" href="/game" style="text-decoration:none;color:inherit">
        <b>Грибниця</b><span>рівні, скіни, досягнення з сум чеків</span></a>
      <a class="kpi" href="/tech" style="text-decoration:none;color:inherit">
        <b>Під капотом</b><span>усі сценарії, виклики MCP і демо-дані</span></a>
    </div>
    <p class="soft" style="margin-top:12px">Оформлення замовлення агент не виконує —
      доводить до кнопки «Оформити» й зупиняється.</p>`);
}

mountTop('home');
$('#nav').innerHTML = appNav('chat');
$('#btn-left').innerHTML = icon('panel', 18);
$('#btn-right').innerHTML = icon('cart', 18);
$('#ab-game').innerHTML = icon('mushroom', 18);
$('#ab-user').innerHTML = icon('user', 18);
$('#cart-refresh').innerHTML = icon('refresh', 17);
$('#sendbtn').innerHTML = icon('right', 18);
ttsInit();
document.querySelectorAll('.side .dhead .iconbtn:not(#cart-refresh)')
  .forEach(b => b.innerHTML = icon('close', 17));

(async () => {
  $('#quicks').innerHTML = QUICKS.map(q =>
    `<button onclick="quick('${q}')">${q}</button>`).join('');
  bubble('it', 'Готовий. Питайте.', { silent: true });
  await Promise.all([loadStatus(), loadAllergies()]);
  await Promise.all([mountScenarios(), renderCart($('#cart-side')), loadExpiring()]);
  const s = await api('/api/chat/status');
  $('#chat-note').textContent = s.available
    ? `Модель ${s.model}: намір визначає вона.`
    : 'Без моделі намір визначаю за ключовими словами.';
  $('#mode-note').textContent = s.available
    ? 'Кнопка виконує сценарій напряму; «через модель» — тією самою фразою.'
    : 'Модель офлайн: вільний текст розбираю правилами й усе одно виконую сценарій.';
})();

async function loadExpiring(){
  const e = await api('/api/expiring?days=1');
  const all = [...(e.coupons || []), ...(e.promos || [])];
  $('#expiring').innerHTML = all.length
    ? all.slice(0, 6).map(c => `
        <div class="ticket"><div class="v" style="background:${c.color || '#2B5CE6'}">
          ${c.value ?? '•'}</div>
          <div class="t"><b>${c.about || c.title || '—'}</b>
            <span>${c.reward || ''}</span></div></div>`).join('')
    : '<span class="soft">Сьогодні нічого не згорає.</span>';
}
</script>
</body>
</html>
