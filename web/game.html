<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Грибниця · Хакатон «Сільпо»</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="shell" id="shell"><main class="main">
  <div class="appwrap" style="max-width:760px">
    <div class="appframe flat">
      <div class="appbar">
        <a class="iconbtn sm plain" href="/profile" title="Назад" id="ab-back"></a>
        <span class="ttl">Грибниця</span>
      </div>

      <div class="pagebody">
        <section class="card gamecard">
          <div id="level" class="muted">Рахую з чеків…</div>
          <div class="iconrow four" id="game-tiles"></div>
          <!-- Коріння: від ніжки гриба вниз, вузол за вузлом — рівень за рівнем.
               Пройдені вузли заповнені, поточний — світиться, нагороди — кожні
               пʼять. Тап по вузлу — нагорода або що треба до нього. -->
          <div class="myc root" id="myc"></div>
        </section>
      </div>

      <div id="nav"></div>
    </div>
  </div>
</main></div>

<dialog id="picker"><div id="picker-body"></div></dialog>
<dialog id="quiz"><div id="quiz-body"></div></dialog>

<script src="/app.js"></script>
<script>
let GAME = null;

function rnd(seed){ let s = seed; return () => (s = s * 1103515245 + 12345 & 0x7fffffff) / 0x7fffffff; }

function shroomSvg(s, cx, cy, scale){
  const cap = (s && s.cap) || '#E8D8C4', stem = (s && s.stem) || '#F5EFE6';
  return `<g transform="translate(${cx} ${cy}) scale(${scale || 1})">
    <path d="M-13 0 q-3 -26 4 -34 h18 q7 8 4 34 z" fill="${stem}"/>
    <path d="M-56 -30 a56 40 0 0 1 112 0 q-56 13 -112 0 z" fill="${cap}"/>
    <ellipse cx="-20" cy="-44" rx="9" ry="5.5" fill="#fff" fill-opacity=".5"/>
    <ellipse cx="16" cy="-37" rx="6" ry="3.6" fill="#fff" fill-opacity=".35"/>
  </g>`;
}

/* Коріння. Від ніжки гриба вниз іде головний корінь, і на ньому — вузли:
   один на рівень. Ліворуч-праворуч він відхиляється тим сильніше, чим
   дорожчий рівень (крива 16 % видна, а не написана). Спори — досягнення. */
let LEVELS = null;
function rootScene(g, levels){
  const W = 400, GROUND = 78, STEP = 46, AMP = 96;
  const rows = levels.levels;
  const H = GROUND + 30 + rows.length * STEP + 30;
  const max = Math.max(...rows.map(l => l.need));
  const r = rnd((g.level || 1) * 7919 + 17);
  const claimed = g.claimed || {};
  const ready = new Set((g.rewards_ready || []).map(x => x.level));

  // точки вузлів: униз, корінь блукає ліворуч-праворуч повільною хвилею
  // (не зигзагом), а розмах росте з ціною рівня — крива 16 % видна в геометрії
  const phase = r() * 6.28;
  const pts = rows.map((l, i) => {
    const wander = Math.sin(i * .62 + phase) * .75 + Math.sin(i * 1.7 + phase * 2) * .25;
    const x = W / 2 + wander * (14 + Math.sqrt(l.need / max) * AMP) + (r() - .5) * 8;
    return { x, y: GROUND + 34 + i * STEP, l };
  });
  // плавний корінь через вузли (Catmull-Rom → кубічні сегменти), від ніжки
  const all = [{ x: W / 2, y: GROUND - 2 }, { x: W / 2, y: GROUND + 8 }, ...pts];
  let d = `M${all[0].x} ${all[0].y}`;
  for (let k = 0; k < all.length - 1; k++) {
    const p0 = all[Math.max(0, k - 1)], p1 = all[k], p2 = all[k + 1], p3 = all[Math.min(all.length - 1, k + 2)];
    const c1x = p1.x + (p2.x - p0.x) / 6, c1y = p1.y + (p2.y - p0.y) / 6;
    const c2x = p2.x - (p3.x - p1.x) / 6, c2y = p2.y - (p3.y - p1.y) / 6;
    d += ` C${c1x.toFixed(1)} ${c1y.toFixed(1)} ${c2x.toFixed(1)} ${c2y.toFixed(1)} ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`;
  }
  // корінь тоншає з глибиною: два штрихи — широкий пройдений, тонкий попереду
  const doneIdx = Math.max(0, rows.findIndex(l => l.level === g.level));
  const yNow = pts[doneIdx] ? pts[doneIdx].y : GROUND;
  let hairs = '';
  pts.forEach((p, i) => {
    const n = 1 + Math.round(r());
    for (let k = 0; k < n; k++) {
      const ang = (r() - .5) * 2.2 + (p.x < W / 2 ? Math.PI : 0);
      const len = 14 + r() * 26;
      const ex = p.x + Math.cos(ang) * len, ey = p.y + 6 + Math.sin(ang) * len * .6 + r() * 8;
      hairs += `<path d="M${p.x.toFixed(1)} ${(p.y + 4).toFixed(1)} Q${((p.x + ex) / 2 + (r() - .5) * 10).toFixed(1)} ${((p.y + ey) / 2 + 6).toFixed(1)} ${ex.toFixed(1)} ${ey.toFixed(1)}"
        fill="none" stroke="#7BE8A0" stroke-opacity="${i < doneIdx ? .38 : .18}" stroke-width="1.2" stroke-linecap="round"/>`;
    }
  });
  let spores = '';
  for (let i = 0; i < ((g.mycelium || {}).spores || 0); i++) {
    const x = 24 + r() * (W - 48), y = GROUND + 20 + r() * (H - GROUND - 40);
    spores += `<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="2.4" fill="#FFD979">
      <animate attributeName="fill-opacity" values="1;.3;1" dur="${(2.4 + r() * 2).toFixed(1)}s" repeatCount="indefinite"/></circle>`;
  }
  const nodes = pts.map((p, i) => {
    const l = p.l, done = l.level <= g.level, now = l.level === g.level;
    const got = claimed[String(l.level)], gift = !!l.reward, can = ready.has(l.level);
    const left = p.x > W / 2;   // підпис — у бік центру, де є місце
    const label = now ? 'ти тут' : l.skin ? `скін «${l.skin}»`
      : gift ? (got ? 'забрано' : can ? 'нагорода чекає' : l.reward.title)
      : (done ? '' : uah(l.need) + ' ₴');
    return `<g class="lv ${done ? 'done' : 'ahead'} ${now ? 'now' : ''} ${can ? 'can' : ''}"
        onclick="tapLevel(${l.level})" style="cursor:pointer" id="l${l.level}">
      ${now ? `<circle cx="${p.x.toFixed(1)}" cy="${p.y}" r="17" fill="#FFD979" fill-opacity=".18">
        <animate attributeName="r" values="14;20;14" dur="2.6s" repeatCount="indefinite"/></circle>` : ''}
      ${can ? `<circle cx="${p.x.toFixed(1)}" cy="${p.y}" r="13" fill="none" stroke="#FFD979" stroke-width="1.5">
        <animate attributeName="r" values="11;15;11" dur="1.8s" repeatCount="indefinite"/></circle>` : ''}
      <circle cx="${p.x.toFixed(1)}" cy="${p.y}" r="${now ? 9 : 6.5}"
        fill="${now ? '#FFD979' : done ? '#C7B4FA' : '#1C1730'}" stroke="${done || now ? 'none' : '#7BE8A0'}" stroke-width="1.6"/>
      ${gift && !got ? `<circle cx="${(p.x + (now ? 8 : 6)).toFixed(1)}" cy="${p.y - (now ? 8 : 6)}" r="3" fill="#FF8A34"/>` : ''}
      <text x="${(p.x + (left ? -16 : 16)).toFixed(1)}" y="${p.y + 4}" text-anchor="${left ? 'end' : 'start'}"
        font-size="12" font-weight="700" fill="${now ? '#FFD979' : done ? '#E8E4F6' : '#8E88A8'}">${l.level}</text>
      ${label ? `<text x="${(p.x + (left ? -1 : 1) * (l.level > 9 ? 40 : 32)).toFixed(1)}" y="${p.y + 4}" text-anchor="${left ? 'end' : 'start'}"
        font-size="10.5" fill="${now ? '#FFD979' : '#8E88A8'}">${label}</text>` : ''}
    </g>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Коріння: ${g.level} рівень">
    <defs><clipPath id="doneclip"><rect x="0" y="0" width="${W}" height="${yNow}"/></clipPath>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EDF1FA"/><stop offset="1" stop-color="#E4E9F6"/></linearGradient>
      <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1A1526"/><stop offset="1" stop-color="#0E0B16"/></linearGradient></defs>
    <rect x="0" y="0" width="${W}" height="${GROUND}" fill="url(#sky)"/>
    <rect x="0" y="${GROUND}" width="${W}" height="${H - GROUND}" fill="url(#soil)"/>
    <g transform="translate(${W/2} ${GROUND}) scale(.55) translate(${-W/2} ${-GROUND})">
      ${shroomSvg(g.skin, W/2, GROUND, 1)}</g>
    <line x1="0" y1="${GROUND}" x2="${W}" y2="${GROUND}" stroke="#3A3450" stroke-width="1"/>
    ${hairs}
    <path d="${d}" fill="none" stroke="#7BE8A0" stroke-opacity=".28" stroke-width="2.2" stroke-linecap="round"/>
    <path d="${d}" fill="none" stroke="#7BE8A0" stroke-opacity=".85" stroke-width="4" stroke-linecap="round" clip-path="url(#doneclip)"/>
    ${spores}${nodes}</svg>`;
}

async function loadGame(){
  const g = await api('/api/game');
  if(bad(g)) return;
  GAME = g;
  $('#level').innerHTML = `
    <div class="lvl">
      <div class="num">${g.level}</div>
      <div class="meta">
        <b>${g.skin.title}</b>
        <div class="xpbar"><i style="width:${Math.round(g.progress*100)}%"></i></div>
        <div class="soft"><b>${uah(g.xp)} ₴</b> досвіду з ${g.receipts_counted} чеків ·
          до ${g.level+1} рівня ще <b>${uah(g.need_for_next)} ₴</b></div>
      </div>
    </div>`;
  renderTiles();
  LEVELS = await api('/api/game/levels?upto=' + (g.level + 6));
  if (!bad(LEVELS)) $('#myc').innerHTML = rootScene(g, LEVELS);
}

/* Тап по вузлу: нагорода, або що треба, щоб дійти. */
async function tapLevel(level){
  const l = LEVELS.levels.find(x => x.level === level);
  const got = (GAME.claimed || {})[String(level)];
  const reachable = level <= GAME.level;
  if (got) return sheet(`${level} рівень`, l.reward.title, `
    <div class="rw"><div class="t"><b>${got.title}</b>
      <span>забрано ${(got.granted_at||'').slice(0,10)}</span></div>
      <span class="code">${got.code}</span></div>`);
  if (!l.reward) return sheet(`${level} рівень`,
    reachable ? 'пройдено' : `треба ще ${uah(l.total - GAME.xp)} ₴ покупок`,
    `<p>${l.skin ? `Тут відкривається скін <b>«${l.skin}»</b>.` : 'Нагороди на цьому рівні немає — вони кожні пʼять.'}</p>
     <p class="soft">Перехід на цей рівень — ${uah(l.need)} ₴, разом від початку — ${uah(l.total)} ₴.</p>`);
  if (!reachable) return sheet(`${level} рівень`, l.reward.title, `
    <p>Ще не досягнуто. Треба <b>${uah(l.total - GAME.xp)} ₴</b> покупок —
      це ${Math.max(1, Math.round((l.total - GAME.xp) / 280))} середніх чеків.</p>
    <p class="soft">Нагорода: ${l.reward.title} (${l.reward.kind}).</p>`);
  const r = await api('/api/game/claim','POST',{level});
  if (bad(r)) return;
  if (!r.granted) return toast(r.reason || 'Нема чого забирати');
  sheet('Нагорода твоя', `${level} рівень`, `
    <div class="rw"><div class="t"><b>${r.granted.title}</b>
      <span>${r.granted.kind}</span></div>
      <span class="code">${r.granted.code}</span></div>`);
  await loadGame();
}
function focusLevel(level){
  closeSheet();
  const el = document.getElementById('l' + level);
  if (el) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function renderTiles(){
  const g = GAME;
  const ready = (g.rewards_ready || []).length;
  const rows = [
    ['trophy',   'Досягнення', `${g.achievements_done}/${g.achievements_total}`, 'openAch()', ''],
    ['mushroom', 'Скіни',      `${g.skins_unlocked.length}/${g.skins_total}`, 'openSkins()', ''],
    ['compass',  'Магазини', '·', 'openThemed()', '', 'themed-n'],
    ['gift',     'Нагороди',   ready, 'openRewards()', ready ? 'warn' : ''],
  ];
  $('#game-tiles').innerHTML = rows.map(([ic, title, n, act, cls, id]) => `
    <button class="tile sm" onclick="${act}"><span class="em">${icon(ic, 20)}</span>
      <b>${title}</b>
      <span class="n ${cls}"${id ? ` id="${id}"` : ''}>${n}</span></button>`).join('');
}

async function openAch(){
  const d = await api('/api/game/achievements');
  if(bad(d)) return;
  sheet('Досягнення', `${d.done} з ${d.total} · рахуються з чеків, а не з окремих подій`,
    `<div class="ach">${d.achievements.map(a => `
      <div class="a ${a.done ? 'on' : ''}">
        <div class="ttl"><span class="ico">${icon(a.icon, 20)}</span><span>
          <b>${a.title}</b><span class="ab">${a.about}</span></span></div>
        ${a.reward ? `<div class="prize">${a.reward}</div>` : ''}
        <div class="pg"><span>${a.done ? 'відкрито ' + (a.unlocked_at||'').slice(0,10) : 'прогрес'}</span>
          <b>${uah(a.have)} / ${uah(a.target)}</b></div>
        <div class="xpbar" style="height:7px;margin:5px 0 0"><i style="width:${
          Math.round(a.progress*100)}%${a.done ? ';background:var(--green)' : ''}"></i></div>
      </div>`).join('')}</div>`);
}

async function openSkins(){
  const d = await api('/api/game/skins');
  if(bad(d)) return;
  sheet('Скіни Машрума', 'Кожні 10 рівнів. Два скіни витратами не купуються — тільки за досягнення',
    `<div class="skins">${d.skins.map(s => `
      <button class="skin" aria-pressed="${s.current}" ${s.unlocked ? '' : 'disabled'}
        onclick="pickSkin('${s.id}')" title="${s.about}">
        <svg class="shroom" viewBox="-64 -76 128 84" aria-hidden="true">${
          shroomSvg(s, 0, 0, 1)}</svg>
        <b>${s.title}</b>
        <span>${s.unlocked ? (s.current ? 'обрано' : 'відкрито') : s.how}</span>
      </button>`).join('')}</div>`);
}
async function pickSkin(id){
  const r = await api('/api/game/skin','POST',{skin_id:id});
  if(bad(r)) return;
  closeSheet(); toast(`Машрум тепер «${r.skin.title}»`);
  await loadGame();
}

async function openThemed(){
  const d = await api('/api/game/themed');
  if(bad(d)) return;
  const n = $('#themed-n'); if (n) n.textContent = `${d.visited}/${d.total}`;
  sheet('Дизайнерські «Сільпо»', `Обійдено ${d.visited} з ${d.total}`, `
    <div class="themed">${d.branches.map(b => `
      <div class="th ${b.visited ? 'on' : ''}">
        <span class="mark">${b.visited ? icon('spark', 15) : ''}</span>
        <b>${b.theme}</b>
        <span>${b.city}, ${b.address}</span>
        <span style="margin-top:5px">${b.about}</span>
        ${b.source ? `<a class="link" href="${b.source}" target="_blank"
          rel="noopener">джерело ↗</a>` : ''}
      </div>`).join('')}</div>`);
}

function openRewards(){
  const g = GAME;
  const ready = g.rewards_ready || [];
  const got = Object.values(g.claimed || {});
  sheet('Нагороди за рівні', '', `
    ${ready.map(r => `<div class="rw"><div class="t"><b>${r.title}</b>
        <span>за ${r.level} рівень · ${r.kind}</span></div>
        <button class="go" onclick="focusLevel(${r.level})">Забрати</button></div>`).join('')}
    ${got.map(r => `<div class="rw" style="border-style:solid;border-color:var(--line);
        background:var(--tint)"><div class="t"><b>${r.title}</b>
        <span>забрано ${(r.granted_at||'').slice(0,10)}</span></div>
        <span class="code">${r.code}</span></div>`).join('')}
    ${!ready.length && !got.length ? '<p class="soft">Нагород поки немає.</p>' : ''}`);
}

mountTop('game');
$('#nav').innerHTML = appNav('profile');
$('#ab-back').innerHTML = icon('back', 18);
$('#ab-back').href = withRec('/profile');
(async () => {
  await loadStatus();
  await loadGame();
  const t = await api('/api/game/themed');
  const n = $('#themed-n'); if (n && !bad(t)) n.textContent = `${t.visited}/${t.total}`;
})();
</script>
</body>
</html>
