<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Грибниця · Хакатон «Сільпо»</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="shell" id="shell"><main class="main">
  <div class="appwrap" style="max-width:760px">
    <div class="appframe flat">
      <div class="appbar">
        <a class="iconbtn sm plain" href="/profile" title="Назад" id="ab-back"></a>
        <span class="ttl">Грибниця</span>
        <a class="iconbtn sm plain" href="/road" title="Шлях рівнів" id="ab-road"></a>
      </div>

      <div class="pagebody">
        <section class="card gamecard">
          <div id="level" class="muted">Рахую з чеків…</div>
          <div class="myc mini" id="myc"></div>
        </section>

        <div class="iconrow" id="game-tiles" style="margin-top:14px"></div>

        <a class="roadlink" href="/road" id="roadlink">
          <span class="ic" id="road-ic"></span>
          <span class="t"><b>Шлях рівнів</b>
            <span id="road-sub">крива видно як стежку — від 1-го до 30-го</span></span>
          <span class="go ghost">Відкрити</span>
        </a>
      </div>

      <div id="nav"></div>
    </div>
  </div>
</main></div>

<dialog id="picker"><div id="picker-body"></div></dialog>
<dialog id="quiz"><div id="quiz-body"></div></dialog>

<script src="/app.js"></script>
<script>
let GAME = null;

function rnd(seed){ let s = seed; return () => (s = s * 1103515245 + 12345 & 0x7fffffff) / 0x7fffffff; }

function shroomSvg(s, cx, cy, scale){
  const cap = (s && s.cap) || '#E8D8C4', stem = (s && s.stem) || '#F5EFE6';
  return `<g transform="translate(${cx} ${cy}) scale(${scale || 1})">
    <path d="M-13 0 q-3 -26 4 -34 h18 q7 8 4 34 z" fill="${stem}"/>
    <path d="M-56 -30 a56 40 0 0 1 112 0 q-56 13 -112 0 z" fill="${cap}"/>
    <ellipse cx="-20" cy="-44" rx="9" ry="5.5" fill="#fff" fill-opacity=".5"/>
    <ellipse cx="16" cy="-37" rx="6" ry="3.6" fill="#fff" fill-opacity=".35"/>
  </g>`;
}

/* Грибниця компактна: вузол на рівень, гілка на полицю, спора на досягнення.
   Ваги не підписуємо — вони живуть у профілі, тут задають лише форму. */
function mycelium(g){
  const m = g.mycelium || {}, W = 680, H = 190, GROUND = 74;
  const strands = m.strands || [], nodes = Math.max(1, m.nodes || 1);
  const r = rnd(nodes * 7919 + strands.length * 31 + 1);
  const maxW = Math.max(1, ...strands.map(s => Math.abs(s.weight)));
  let paths = '', dots = '', spores = '';
  strands.forEach((s, i) => {
    const spread = strands.length > 1 ? i / (strands.length - 1) : .5;
    const endX = 55 + spread * (W - 110);
    const endY = GROUND + 40 + r() * (H - GROUND - 55);
    const midX = W / 2 + (endX - W / 2) * .5;
    const midY = GROUND + 16 + r() * 16;
    const k = Math.abs(s.weight) / maxW;
    paths += `<path d="M${W/2} ${GROUND} Q${midX.toFixed(0)} ${midY.toFixed(0)} ${endX.toFixed(0)} ${endY.toFixed(0)}"
      fill="none" stroke="#7BE8A0" stroke-opacity="${(.26 + .5 * k).toFixed(2)}"
      stroke-width="${(1 + 3 * k).toFixed(2)}" stroke-linecap="round"/>`;
    const per = Math.max(1, Math.round(nodes / strands.length));
    for (let j = 1; j <= per; j++){
      const t = j / (per + 1);
      const x = (1-t)*(1-t)*(W/2) + 2*(1-t)*t*midX + t*t*endX;
      const y = (1-t)*(1-t)*GROUND + 2*(1-t)*t*midY + t*t*endY;
      dots += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="1.9"
        fill="#C7B4FA" fill-opacity=".9"/>`;
    }
  });
  for (let i = 0; i < (m.spores || 0); i++){
    const x = 35 + r() * (W - 70), y = GROUND + 14 + r() * (H - GROUND - 26);
    spores += `<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="2.6" fill="#FFD979">
      <animate attributeName="fill-opacity" values="1;.3;1" dur="${(2.4+r()*2).toFixed(1)}s"
        repeatCount="indefinite"/></circle>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" role="img"
      aria-label="Грибниця: ${nodes} вузлів рівня, ${strands.length} гілок, ${m.spores||0} спор">
    <g transform="translate(${W/2} ${GROUND}) scale(.62) translate(${-W/2} ${-GROUND})">
      ${shroomSvg(g.skin, W/2, GROUND, 1)}</g>
    <line x1="0" y1="${GROUND}" x2="${W}" y2="${GROUND}" stroke="#3A3450" stroke-width="1"/>
    ${paths}${dots}${spores}</svg>`;
}

async function loadGame(){
  const g = await api('/api/game');
  if(bad(g)) return;
  GAME = g;
  $('#level').innerHTML = `
    <div class="lvl">
      <div class="num">${g.level}</div>
      <div class="meta">
        <b>${g.skin.title}</b>
        <div class="xpbar"><i style="width:${Math.round(g.progress*100)}%"></i></div>
        <div class="soft"><b>${uah(g.xp)} ₴</b> досвіду з ${g.receipts_counted} чеків ·
          до ${g.level+1} рівня ще <b>${uah(g.need_for_next)} ₴</b></div>
      </div>
    </div>
    <p class="soft" style="margin:9px 0 0">Досвід — округлені суми чеків. Накрутити не
      можна: агент бере їх із <span class="mono">silpo_get_my_offline_orders</span>.</p>`;
  $('#myc').innerHTML = mycelium(g);
  renderTiles();
  $('#road-sub').textContent =
    `ти на ${g.level}-му · до наступного ${uah(g.need_for_next)} ₴` +
    (g.rewards_ready.length ? ` · ${g.rewards_ready.length} нагород чекає` : '');
}

function renderTiles(){
  const g = GAME;
  const ready = (g.rewards_ready || []).length;
  const rows = [
    ['trophy',   'Досягнення', 'рахуються з чеків',
     `${g.achievements_done}/${g.achievements_total}`, 'openAch()', ''],
    ['mushroom', 'Скіни', 'кожні 10 рівнів',
     `${g.skins_unlocked.length}/${g.skins_total}`, 'openSkins()', ''],
    ['compass',  'Дизайнерські «Сільпо»', 'магазини-концепції',
     '·', 'openThemed()', '', 'themed-n'],
    ['gift',     'Нагороди', 'промокод за рівень', ready, 'openRewards()', ready ? 'warn' : ''],
  ];
  $('#game-tiles').innerHTML = rows.map(([ic, title, sub, n, act, cls, id]) => `
    <button class="tile" onclick="${act}"><span class="em">${icon(ic, 22)}</span>
      <b>${title}</b><span>${sub}</span>
      <span class="n ${cls}"${id ? ` id="${id}"` : ''}>${n}</span></button>`).join('');
}

async function openAch(){
  const d = await api('/api/game/achievements');
  if(bad(d)) return;
  sheet('Досягнення', `${d.done} з ${d.total} · рахуються з чеків, а не з окремих подій`,
    `<div class="ach">${d.achievements.map(a => `
      <div class="a ${a.done ? 'on' : ''}">
        <div class="ttl"><span class="ico">${icon(a.icon, 20)}</span><span>
          <b>${a.title}</b><span class="ab">${a.about}</span></span></div>
        ${a.reward ? `<div class="prize">${a.reward}</div>` : ''}
        <div class="pg"><span>${a.done ? 'відкрито ' + (a.unlocked_at||'').slice(0,10) : 'прогрес'}</span>
          <b>${uah(a.have)} / ${uah(a.target)}</b></div>
        <div class="xpbar" style="height:7px;margin:5px 0 0"><i style="width:${
          Math.round(a.progress*100)}%${a.done ? ';background:var(--green)' : ''}"></i></div>
      </div>`).join('')}</div>`);
}

async function openSkins(){
  const d = await api('/api/game/skins');
  if(bad(d)) return;
  sheet('Скіни Машрума', 'Кожні 10 рівнів. Два скіни витратами не купуються — тільки за досягнення',
    `<div class="skins">${d.skins.map(s => `
      <button class="skin" aria-pressed="${s.current}" ${s.unlocked ? '' : 'disabled'}
        onclick="pickSkin('${s.id}')" title="${s.about}">
        <svg class="shroom" viewBox="-64 -76 128 84" aria-hidden="true">${
          shroomSvg(s, 0, 0, 1)}</svg>
        <b>${s.title}</b>
        <span>${s.unlocked ? (s.current ? 'обрано' : 'відкрито') : s.how}</span>
      </button>`).join('')}</div>`);
}
async function pickSkin(id){
  const r = await api('/api/game/skin','POST',{skin_id:id});
  if(bad(r)) return;
  closeSheet(); toast(`Машрум тепер «${r.skin.title}»`);
  await loadGame();
}

async function openThemed(){
  const d = await api('/api/game/themed');
  if(bad(d)) return;
  const n = $('#themed-n'); if (n) n.textContent = `${d.visited}/${d.total}`;
  sheet('Дизайнерські «Сільпо»', `Обійдено ${d.visited} з ${d.total}`, `
    <div class="themed">${d.branches.map(b => `
      <div class="th ${b.visited ? 'on' : ''}">
        <span class="mark">${b.visited ? icon('spark', 15) : ''}</span>
        <b>${b.theme}</b>
        <span>${b.city}, ${b.address}</span>
        <span style="margin-top:5px">${b.about}</span>
        ${b.source ? `<a class="link" href="${b.source}" target="_blank"
          rel="noopener">джерело ↗</a>` : ''}
      </div>`).join('')}</div>
    <p class="soft" style="margin:12px 0 0">Магазини й теми справжні — з пресрелізів
      мережі, звірені з <span class="mono">silpo_list_branches</span>. Немає в API лише
      самої прив'язки «філія → концепція», а дизайнерських супермаркетів у мережі
      понад 60. Саме тому потрібен <span class="mono">silpo_get_themed_branches</span>.</p>`);
}

function openRewards(){
  const g = GAME;
  const ready = g.rewards_ready || [];
  const got = Object.values(g.claimed || {});
  sheet('Нагороди за рівні', 'Що вищий рівень — то кращий промокод. Кожні 5 рівнів', `
    ${ready.map(r => `<div class="rw"><div class="t"><b>${r.title}</b>
        <span>за ${r.level} рівень · ${r.kind}</span></div>
        <a class="go" href="/road#l${r.level}" style="text-decoration:none">Забрати на шляху</a></div>`).join('')}
    ${got.map(r => `<div class="rw" style="border-style:solid;border-color:var(--line);
        background:var(--tint)"><div class="t"><b>${r.title}</b>
        <span>забрано ${(r.granted_at||'').slice(0,10)}</span></div>
        <span class="code">${r.code}</span></div>`).join('')}
    ${!ready.length && !got.length ? '<p class="soft">Нагород поки немає.</p>' : ''}
    ${g.next_reward ? `<p class="soft" style="margin-top:8px">Наступна — «${g.next_reward.title}»
      через ${g.next_reward.levels_away} рівень(-і).</p>` : ''}
    <p class="soft">Нагорода забирається натисканням на сам рівень на шляху.</p>`);
}

mountTop('game');
$('#nav').innerHTML = appNav('profile');
$('#ab-back').innerHTML = icon('back', 18);
$('#ab-road').innerHTML = icon('map', 18);
$('#road-ic').innerHTML = icon('map', 22);
(async () => {
  await loadStatus();
  await loadGame();
  const t = await api('/api/game/themed');
  const n = $('#themed-n'); if (n && !bad(t)) n.textContent = `${t.visited}/${t.total}`;
})();
</script>
</body>
</html>
